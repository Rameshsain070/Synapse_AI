name: Unified Web Interface Build

on:
  push:
    branches: [main]
    paths:
      - 'unified-web-interface/**'
  pull_request:
    branches: [main]
    paths:
      - 'unified-web-interface/**'

defaults:
  run:
    working-directory: unified-web-interface

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: unified-web-interface/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-web-build
          path: unified-web-interface/out
          retention-days: 7
