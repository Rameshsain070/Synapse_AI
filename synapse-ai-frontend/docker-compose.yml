services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - synapse-network

  backend:
    build:
      context: ../synapseai-platform
    ports:
      - "8000:8000"
    env_file:
      - ../synapseai-platform/.env
    networks:
      - synapse-network

networks:
  synapse-network:
    driver: bridge
