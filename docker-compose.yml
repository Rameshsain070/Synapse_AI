version: "3.8"

services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapseai}
      POSTGRES_USER: ${POSTGRES_USER:-synapseai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseai_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./synapseai-platform/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapseai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - synapse-network

  # ── FastAPI Backend ──
  backend:
    build:
      context: ./synapseai-platform
      args:
        APP_ENV: ${APP_ENV:-development}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - synapse-network

  # ── React Frontend (optional – for local dev of the React app) ──
  frontend:
    build:
      context: ./synapse-ai-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - synapse-network

volumes:
  pgdata:

networks:
  synapse-network:
    driver: bridge
